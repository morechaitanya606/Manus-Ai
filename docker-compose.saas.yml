services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atelier_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atelier-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: atelier-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c " until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; /usr/bin/mc mb --ignore-existing local/atelier-assets; /usr/bin/mc anonymous set public local/atelier-assets; exit 0; "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atelier-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atelier_saas?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/atelier-assets
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long-here
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long-here
    ports:
      - '5001:5001'
    command: sh -c "npx prisma db push --schema=apps/api/prisma/schema.prisma && npx ts-node apps/api/prisma/seed.ts && npm run dev --workspace @atelier/api"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atelier-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atelier_saas?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/atelier-assets
    command: npm run dev:worker --workspace @atelier/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
        NEXT_PUBLIC_TENANT_SLUG: atelier-thread
    container_name: atelier-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
      NEXT_PUBLIC_TENANT_SLUG: atelier-thread
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  minio_data:
