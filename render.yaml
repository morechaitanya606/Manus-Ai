services:
  - type: web
    name: fashion-backend-api
    env: node
    rootDir: backend
    plan: starter
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_NO_ORIGIN
        value: "false"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_REQUIRED
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: fashion-redis
          property: connectionString
      - key: RATE_LIMIT_REDIS_ENABLED
        value: "true"
      - key: RATE_LIMIT_REDIS_URL
        fromService:
          type: redis
          name: fashion-redis
          property: connectionString
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: fashion-redis
          property: connectionString
      - key: FORCE_HTTPS
        value: "true"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "15000"
      - key: CIRCUIT_BREAKER_ENABLED
        value: "false"
      - key: CIRCUIT_BREAKER_FAILURE_THRESHOLD
        value: "5"
      - key: CIRCUIT_BREAKER_RESET_TIMEOUT_MS
        value: "30000"
      - key: LOG_LEVEL
        value: info
      - key: API_RATE_LIMIT
        value: "100"
      - key: AUTH_RATE_LIMIT
        value: "30"
      - key: LOGIN_RATE_LIMIT
        value: "5"

  - type: worker
    name: fashion-order-worker
    env: node
    rootDir: backend
    plan: starter
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run worker:orders
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORDER_EVENTS_ASYNC_ENABLED
        value: "true"
      - key: ORDER_EVENTS_QUEUE_REQUIRED
        value: "false"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "15000"
      - key: QUEUE_REDIS_URL
        fromService:
          type: redis
          name: fashion-redis
          property: connectionString
      - key: LOG_LEVEL
        value: info

  - type: web
    name: fashion-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_HOST
        sync: false

  - type: redis
    name: fashion-redis
    plan: starter
