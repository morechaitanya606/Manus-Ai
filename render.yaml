# Render Blueprint — ManusAI Backend
# Deploy with: https://render.com/deploy
# This creates the API service on Render free tier

services:
  - type: web
    name: manusai-api
    runtime: node
    region: singapore  # closest to India
    plan: free
    buildCommand: npm install && cd apps/api && npx prisma generate
    startCommand: cd apps/api && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ALLOWED_ORIGINS
        sync: false
