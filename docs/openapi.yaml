openapi: 3.0.3
info:
  title: Atelier Thread API
  version: 1.0.0
  description: API-first contract for modular monolith e-commerce backend.
servers:
  - url: http://localhost:5000/api/v1
    description: Preferred versioned API
  - url: http://localhost:5000/api
    description: Legacy compatibility API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        requestId:
          type: string
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    SignupRequest:
      allOf:
        - $ref: '#/components/schemas/AuthRequest'
        - type: object
          required: [name]
          properties:
            name:
              type: string
            address:
              type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Product:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [men, women]
        type:
          type: string
        price:
          type: number
        sizes:
          type: array
          items:
            type: string
        colors:
          type: array
          items:
            type: string
        stock:
          type: integer
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
        priceSnapshot:
          type: number
        selectedSize:
          type: string
        selectedColor:
          type: string
    CreateOrderRequest:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        shippingAddress:
          type: string
        paymentProvider:
          type: string
          enum: [mock, stripe, razorpay]
paths:
  /health:
    get:
      summary: Service health status with database connectivity
      responses:
        '200':
          description: Service healthy
        '503':
          description: Service unavailable
  /auth/signup:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      summary: Invalidate user session(s)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session invalidated
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new short-lived access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed
        '401':
          description: Refresh token invalid or expired
        '501':
          description: Refresh flow disabled in current environment
  /products:
    get:
      summary: List products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Product list
    post:
      summary: Create product (admin)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /products/categories:
    get:
      summary: List active product categories
      responses:
        '200':
          description: Category list
  /products/{id}:
    get:
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product
    put:
      summary: Update product (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft delete product (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /products/{id}/stock:
    patch:
      summary: Update product stock (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock]
              properties:
                stock:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Stock updated
  /inventory/{id}/stock:
    patch:
      summary: Update product stock via inventory module (admin alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock]
              properties:
                stock:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Stock updated
  /orders:
    post:
      summary: Create order
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Required for idempotent order creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
    get:
      summary: List orders (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order list
  /orders/checkout:
    post:
      summary: Convert current user cart to order
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Required for idempotent checkout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddress:
                  type: string
                paymentProvider:
                  type: string
                  enum: [mock, stripe, razorpay]
      responses:
        '201':
          description: Order created from cart
  /orders/my:
    get:
      summary: Current user orders (paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: My orders
  /orders/payment-intent:
    post:
      summary: Create payment intent for checkout
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Required for idempotent payment-intent creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        '200':
          description: Payment intent created
  /users:
    get:
      summary: List users (admin, paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: User list
  /users/me:
    get:
      summary: Current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
    put:
      summary: Update current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
  /cart:
    post:
      summary: Add item to cart (module alias)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '200':
          description: Item added
    delete:
      summary: Clear current user cart (module alias)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared
  /cart/{itemId}:
    put:
      summary: Update cart item quantity (module alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart item updated
    delete:
      summary: Remove cart item (module alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cart item removed
  /metrics/performance:
    get:
      summary: Runtime performance metrics (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Performance snapshot
