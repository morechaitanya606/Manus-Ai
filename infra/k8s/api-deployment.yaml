apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-api
  namespace: atelier-saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atelier-api
  template:
    metadata:
      labels:
        app: atelier-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/atelier-api:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: atelier-api-config
            - secretRef:
                name: atelier-api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: atelier-api
  namespace: atelier-saas
spec:
  selector:
    app: atelier-api
  ports:
    - name: http
      port: 80
      targetPort: 5001
