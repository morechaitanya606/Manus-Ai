apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atelier-ingress
  namespace: atelier-saas
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - app.your-domain.com
        - api.your-domain.com
      secretName: atelier-tls
  rules:
    - host: app.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier-web
                port:
                  number: 80
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier-api
                port:
                  number: 80
