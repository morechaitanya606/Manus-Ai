apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-worker
  namespace: atelier-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atelier-worker
  template:
    metadata:
      labels:
        app: atelier-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/atelier-api:latest
          command: ["npm", "run", "worker", "--workspace", "@atelier/api"]
          envFrom:
            - configMapRef:
                name: atelier-api-config
            - secretRef:
                name: atelier-api-secrets
