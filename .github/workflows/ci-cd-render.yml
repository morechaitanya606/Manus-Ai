name: CI/CD Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Backend syntax check
        run: |
          find backend/src backend/server backend/scripts -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Backend bootstrap smoke test
        run: |
          NODE_ENV=test \
          MONGO_URI=mongodb://localhost:27017/fashion_ci \
          JWT_SECRET=1234567890123456 \
          node -e "require('./backend/src/config/env').validateEnv(); require('./backend/server/app'); console.log('backend_bootstrap_ok')"

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Compose config validation
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose config > /dev/null
            docker compose -f docker-compose.scale.yml config > /dev/null
          else
            echo "Docker Compose is not available in this runner image. Skipping compose validation."
          fi

  deploy-render:
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          hooks=()

          [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ] && hooks+=("$RENDER_DEPLOY_HOOK_URL")
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK_URL:-}" ] && hooks+=("$RENDER_BACKEND_DEPLOY_HOOK_URL")
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK_URL:-}" ] && hooks+=("$RENDER_FRONTEND_DEPLOY_HOOK_URL")
          [ -n "${RENDER_WORKER_DEPLOY_HOOK_URL:-}" ] && hooks+=("$RENDER_WORKER_DEPLOY_HOOK_URL")

          if [ ${#hooks[@]} -eq 0 ]; then
            echo "No Render deploy hook secrets configured. Skipping deployment trigger."
            exit 0
          fi

          for hook in "${hooks[@]}"; do
            curl -fsS -X POST "$hook"
            echo "Triggered Render deploy hook."
          done
