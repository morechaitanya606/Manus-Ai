name: SaaS CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma format check
        run: npx prisma format --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

  docker-build:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t atelier-api:${{ github.sha }} .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t atelier-web:${{ github.sha }} .

      - name: Trigger deploy hooks
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "${RENDER_API_DEPLOY_HOOK:-}" ] && curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK"
          [ -n "${RENDER_WORKER_DEPLOY_HOOK:-}" ] && curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK"
          [ -n "${VERCEL_DEPLOY_HOOK:-}" ] && curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
