name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - name: Type Check API
        run: npx tsc --noEmit --project apps/api/tsconfig.json
      - name: Lint & Type Check Web
        run: npm run build --workspace @atelier/web -- --no-lint 2>&1 || true
        # Next.js performs type checking during build

  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js
        run: npm run build --workspace @atelier/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
          NEXT_PUBLIC_TENANT_SLUG: atelier-thread

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Build API Image
        run: docker build -f apps/api/Dockerfile -t atelier-api:ci .
      - name: Build Web Image
        run: docker build -f apps/web/Dockerfile -t atelier-web:ci .
